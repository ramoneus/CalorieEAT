<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="calorEAT" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Calorie and macro tracker with Greek and everyday foods." />
    <title>calorEAT</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong one.
      try {
        const saved = localStorage.getItem('calorie-tracker:theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
        document.querySelector('meta[name=theme-color]').content = dark ? '#020617' : '#f8fafc'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
