<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Καταγραφή θερμίδων και μακροθρεπτικών με ελληνικά φαγητά." />
    <title>calorEAT</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong one.
      try {
        const saved = localStorage.getItem('calorie-tracker:theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
